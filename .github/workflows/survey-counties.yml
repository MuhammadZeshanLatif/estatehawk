name: Survey county sites
on: workflow_dispatch
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests openpyxl pdfplumber
      - run: python tools/test_files.py summit
