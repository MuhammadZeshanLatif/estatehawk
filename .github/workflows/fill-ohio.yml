name: Fill Ohio addresses (statewide parcel map)
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "County ids separated by spaces (e.g. 20). Empty = every Ohio county."
        required: false
        default: ""
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}", TZ: Asia/Karachi }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m app.cli fill-ohio $(echo "$IDS" | tr -cd '0-9 ')
        env: { IDS: "${{ inputs.ids }}" }
