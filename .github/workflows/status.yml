name: County status
on: workflow_dispatch
jobs:
  status:
    runs-on: ubuntu-latest
    env: { DATABASE_URL: "${{ secrets.DATABASE_URL }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt cryptography certifi
      - run: python tools/test_files.py "lgbs:TX:HARDIN COUNTY" "lgbs:PA:PHILADELPHIA COUNTY"
