# Render blueprint: free web service. Data lives in Neon (DATABASE_URL); the daily sync runs in GitHub Actions.
services:
  - type: web
    name: estatehawk
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/sync/status
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ESTATEHAWK_NO_SCHEDULER
        value: "1"
      - key: TZ
        value: Asia/Karachi
      - key: PYTHON_VERSION
        value: "3.12.7"
